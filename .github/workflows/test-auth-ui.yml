name: MapleThai email and Google auth UI
on:
  push:
    branches: ['feature/**', main]
    paths: ['marketplace.html','marketplace.js','marketplace.css','market-items.js','assets/market/**','auth.html','auth.js','checkout.html','checkout.js','payment-common.js','payment-ui.css','admin-payments.html','admin-payments.js','account-payments.js','account-credit.js','payment-qr.js','vendor/qrcode-generator.js','*-access.js','supabase-client.js','member-home.js','market-watch.js','market-watch-selection.js','market-watch.css','account-market-quota.js','friend-promotion.css','admin.html','admin-sales.html','admin-sales.js','admin-sales.css','premium-guide.html','premium-guide.js','guide-progress.js','my-guides.html','my-guides.js','my-guides.css','scripts/test-*.mjs','supabase/functions/**','.github/workflows/test-auth-ui.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maplethai-web.log 2>&1 &
      - name: Test email, Google OAuth initiation, account recovery, safe redirects and mobile
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-auth-ui.mjs
      - name: Test membership, redemption, guide access and administrator UI
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-access.mjs

      - name: Test checkout, slip submission, purchase history and admin approval UI
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-payments.mjs

      - name: Test logo home links on all pages and embedded guides
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-logo-home.mjs

      - name: Test administrator sales report
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-admin-sales.mjs

      - name: Test automatic slip validation and fraud checks
        run: node scripts/test-auto-verification.mjs

      - name: Test provisional amount-matched access
        run: node scripts/test-provisional-verification.mjs

      - name: Test PromptPay receiver identity and abbreviated names
        run: node scripts/test-promptpay-verification.mjs

      - name: Test guide library, resume, isolation and sync conflicts
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-guide-progress.mjs

      - name: Test homepage market watch selection
        run: node scripts/test-market-watch.mjs

      - name: Test free marketplace posts, contact gates, edit, search and mobile
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-marketplace.mjs

      - name: Test amount QR and receipt credit validation
        run: node scripts/test-payment-qr.mjs

      - name: Test credit balance, remainder QR, cancellation and market redemption
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-credit-browser.mjs

  equipment-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maplethai-gear-web.log 2>&1 &
      - name: Test equipment progression and route isolation
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-equipment.mjs
