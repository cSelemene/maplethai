name: Immersive preview browser test
on:
  push:
    branches: [feature/supabase-auth, main]
    paths:
      - 'index.html'
      - 'home.html'
      - 'class-quiz*.js'
      - 'class-quiz.css'
      - 'scripts/test-class-quiz*.mjs'
      - 'bandit-immersive-preview.html'
      - '*-preview.html'
      - 'guide-preview.html'
      - 'warrior-cards.css'
      - 'warrior-content.*'
      - 'warrior-market-data.js'
      - 'assets/classes/*.png'
      - 'scripts/smoke-immersive.mjs'
      - '.github/workflows/smoke-immersive.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - name: Verify all five tabs in Chrome
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/smoke-immersive.mjs

      - name: Verify class matching and coverage
        run: node scripts/test-class-quiz-model.mjs
      - name: Verify class questionnaire in Chrome
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/test-class-quiz-browser.mjs

