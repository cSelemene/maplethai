name: Bandit Route click diagnostics
on:
  push:
    branches: [feature/supabase-auth]
    paths: ['scripts/diagnose-route.mjs','.github/workflows/diagnose-route.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maplethai-web.log 2>&1 &
      - run: node scripts/diagnose-route.mjs
