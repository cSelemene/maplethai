name: Original Route UI restoration test
on:
  push:
    branches: [feature/supabase-auth, main]
    paths: ['bandit-route-original.html','scripts/smoke-original-route.mjs','.github/workflows/smoke-original-route.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  chrome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maplethai-web.log 2>&1 &
      - run: CHROME_BIN=/usr/bin/google-chrome node scripts/smoke-original-route.mjs
