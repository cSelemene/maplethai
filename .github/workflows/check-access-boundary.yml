name: MapleThai access boundary checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-auth]
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-access-boundary.mjs
