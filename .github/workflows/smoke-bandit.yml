name: Bandit preview browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'bandit-free.html'
      - 'classic-bandit-preview.html'
      - 'scripts/smoke-bandit.mjs'
      - '.github/workflows/smoke-bandit.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - name: Verify Intro is visible and premium lock works
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/smoke-bandit.mjs
