name: Immersive V2 browser checks
on:
  push:
    branches: [feature/supabase-auth]
    paths:
      - 'bandit-immersive-v2.html'
      - 'scripts/smoke-immersive-v2.mjs'
      - '.github/workflows/smoke-immersive-v2.yml'
  workflow_dispatch:
jobs:
  chrome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/maplethai-web.log 2>&1 &
      - name: Test five tabs, next-step lock and scroll transition
        run: CHROME_BIN=/usr/bin/google-chrome node scripts/smoke-immersive-v2.mjs
