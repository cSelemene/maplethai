name: Auto-fix versions and formatting
# Runs on every push. Refreshes ?v= cache-busting versions and formats the
# site's JavaScript, then commits the result back to the same branch, so edits
# made anywhere (ChatGPT, GitHub web editor, a phone) need no manual steps.
# Enabled at the owner's request on 2026-10-17.
on:
  push:
    branches: ['**']
  workflow_dispatch:
concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format JavaScript
        run: npx --yes prettier@3.9.10 --write --log-level warn "*.js" "navigation/*.mjs" "scripts/*.mjs"
      - name: Refresh asset versions
        run: node scripts/stamp-assets.mjs
      - name: Commit fixes
        id: commit
        run: |
          if git diff --quiet; then echo "Nothing to fix."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Auto-fix asset versions and formatting"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages with the fixed files
        # Pushes made with GITHUB_TOKEN do not start a Pages build on their own.
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request failed; the next push will redeploy."
