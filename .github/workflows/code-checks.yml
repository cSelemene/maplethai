name: Code checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Asset version stamps are current
        run: node scripts/stamp-assets.mjs --check
      - name: JavaScript is formatted
        run: npx --yes prettier@3 --check "*.js" "navigation/*.mjs" "scripts/*.mjs"
