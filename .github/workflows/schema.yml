name: Database schema
on:
  push:
    paths: ['supabase/**', 'scripts/test-*.sql', 'scripts/test-schema.mjs', 'assets/market/items.json', '.github/workflows/schema.yml']
  pull_request:
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build database from baseline and run SQL tests
        run: node scripts/test-schema.mjs
