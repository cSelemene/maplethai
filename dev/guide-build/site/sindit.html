<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="description" content="ไกด์ Sindit (โจรปาดาวแล้วเปลี่ยนเป็นมีด) Lv.1–50 MapleStory Classic World">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sindit Route Lv.1–50 — MapleStory Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#D7EAF8; --panel:#FFFFFF; --panel2:#F2F7FC; --ink:#1B2A44; --muted:#56678A;
  --frame:#22406F; --frameInk:#FFFFFF; --maple:#E2711D; --line:#C7D7EA;
  --t-travel:#2F6FD0; --t-talk:#B98500; --t-kill:#D1453B; --t-collect:#2E8B4E;
  --t-turnin:#7A4CC2; --t-craft:#13879A; --t-stop:#6B7280; --t-gear:#A35C1C; --t-note:#56678A;
  --tagInk:#FFFFFF; --radius-lg:14px; --radius-sm:8px;
  --display:"Mitr", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body:"IBM Plex Sans Thai", "Mitr", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0E1930; --panel:#16233C; --panel2:#1B2B48; --ink:#E6EDF8; --muted:#9CACC6;
    --frame:#2C4E86; --frameInk:#FFFFFF; --maple:#F39439; --line:#2B3D5E;
    --t-travel:#6FA4F2; --t-talk:#E7B93A; --t-kill:#F07A70; --t-collect:#5CC583;
    --t-turnin:#B191EA; --t-craft:#4CC3D4; --t-stop:#9CA3AF; --t-gear:#E39A57; --t-note:#9CACC6; --tagInk:#0E1930;
  }
}
:root[data-theme="dark"]{
  --sky:#0E1930; --panel:#16233C; --panel2:#1B2B48; --ink:#E6EDF8; --muted:#9CACC6;
  --frame:#2C4E86; --frameInk:#FFFFFF; --maple:#F39439; --line:#2B3D5E;
  --t-travel:#6FA4F2; --t-talk:#E7B93A; --t-kill:#F07A70; --t-collect:#5CC583;
  --t-turnin:#B191EA; --t-craft:#4CC3D4; --t-stop:#9CA3AF; --t-gear:#E39A57; --t-note:#9CACC6; --tagInk:#0E1930;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--maple);outline-offset:2px;border-radius:6px}

/* Title bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--frame);color:var(--frameInk)}
.bar-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.bar-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.bar-btn:hover{background:rgba(255,255,255,.22)}
.only-mobile{display:none}

/* Level ribbon — the one bold element */
.ribbon{background:var(--frame);padding:0 16px 14px}
.ribbon-inner{max-width:1180px;margin:0 auto}
.track{position:relative;height:30px}
.track-line{position:absolute;left:0;right:0;top:14px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.track-fill{position:absolute;left:0;top:14px;height:4px;border-radius:4px;background:var(--maple);transition:width .35s ease}
.track-tick{position:absolute;top:22px;font-size:.7rem;color:rgba(255,255,255,.65);transform:translateX(-50%)}
.track-leaf{position:absolute;top:2px;width:26px;height:26px;transform:translateX(-50%);transition:left .35s ease;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.track-meta{display:flex;justify-content:space-between;color:rgba(255,255,255,.85);font-size:.82rem;margin-top:12px}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 110px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px}
.chap{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--muted);padding:12px 8px 4px}
.tab{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius-sm);padding:6px 8px;cursor:pointer;align-items:flex-start;font-size:.9rem;line-height:1.35}
.tab:hover{background:var(--panel2)}
.tab[aria-current="step"]{background:var(--frame);color:var(--frameInk)}
.tab .n{flex:0 0 26px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;padding-top:1px}
.tab[aria-current="step"] .n{color:rgba(255,255,255,.75)}
.tab .tt{flex:1}
.tab .ok{flex:0 0 auto;color:var(--t-collect);font-weight:600}
.tab[aria-current="step"] .ok{color:#BFF0CF}

/* Step card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.card-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.lvrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lv{font-family:var(--display);font-weight:600;font-size:2.4rem;line-height:1;color:var(--maple);font-variant-numeric:tabular-nums}
.stepno{color:var(--muted);font-size:.9rem}
.card-head h2{font-family:var(--display);font-weight:500;font-size:1.55rem;line-height:1.3;margin:8px 0 10px}
.where{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.92rem}
.where svg{width:16px;height:16px;color:var(--t-travel)}
.intro{margin:12px 0 0;color:var(--muted);max-width:68ch}

.acts{list-style:none;margin:0;padding:8px 14px 6px}
.act{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 8px;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:0}
.act input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--t-collect);cursor:pointer}
.act.done .main{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;border-radius:6px;padding:1px 8px;margin-right:8px;color:var(--tagInk);vertical-align:1px}
.tag.travel{background:var(--t-travel)} .tag.talk{background:var(--t-talk)} .tag.kill{background:var(--t-kill)}
.tag.collect{background:var(--t-collect)} .tag.turnin{background:var(--t-turnin)} .tag.craft{background:var(--t-craft)}
.tag.stop{background:var(--t-stop)} .tag.gear{background:var(--t-gear)} .tag.note{background:var(--t-note)}
.main{font-weight:500}
.main b{font-weight:600}
.facts{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.sub{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.sub li{margin:2px 0}
.tip{margin:6px 0 0;font-size:.9rem;color:var(--muted)}

.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.box{background:var(--panel2);padding:14px 18px}
.box h3{font-family:var(--display);font-weight:500;font-size:.92rem;margin:0 0 4px;color:var(--muted)}
.box p{margin:0;font-size:.93rem}
.box.leave p{font-weight:500}

.prow.r9{grid-template-columns:1.4fr 1.6fr .8fr .7fr 1.2fr 1.3fr}
.tier{display:inline-block;font-size:.75rem;border:1px solid var(--maple);color:var(--maple);border-radius:6px;padding:0 6px}
@media (max-width:860px){.prow.r9{grid-template-columns:1fr 1fr}.prow.phead.r9{display:none}}
.mlv{display:inline-block;font-size:.7rem;font-weight:600;line-height:1.3;border-radius:5px;padding:0 5px;margin-left:3px;background:var(--t-kill);color:var(--tagInk);vertical-align:1px;white-space:nowrap}
.sellnote{margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--maple);background:color-mix(in srgb, var(--maple) 10%, var(--panel));font-size:.92rem}
/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .count{flex:1;text-align:center;color:var(--muted);font-size:.9rem}
.btn{border:0;border-radius:12px;padding:12px 20px;font-family:var(--display);font-weight:500;font-size:1rem;cursor:pointer;min-width:120px}
.btn.prev{background:var(--panel2);border:1px solid var(--line)}
.btn.next{background:var(--maple);color:#fff;min-width:160px}
.btn:disabled{opacity:.4;cursor:default}

/* Drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:40;display:none}
.overlay.open{display:block}
.drawer{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--panel);padding:calc(14px + env(safe-area-inset-top,0px)) 10px 20px;overflow:auto;transform:translateX(-102%);transition:transform .25s ease}
.drawer.open{transform:none}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:84vh;overflow:auto;background:var(--panel);border-radius:var(--radius-lg);border:1px solid var(--line);padding:18px 20px;display:none}
.modal.open{display:block}
.modal h2{font-family:var(--display);font-weight:500;margin:0 0 4px;font-size:1.3rem}
.modal .close{float:right}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:620px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:500;color:var(--muted)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding-top:12px}
  .side{display:none}
  .only-mobile{display:inline-block}
  .lv{font-size:2rem}
  .card-head h2{font-size:1.3rem}
  .btn{min-width:0;padding:12px 14px}
  .btn.next{min-width:0;flex:0 0 auto}
  .track-tick:nth-child(even){display:none}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
.it{white-space:nowrap}
.it img{width:24px;height:24px;object-fit:contain;vertical-align:-6px;margin-right:3px}
#keepTable td:first-child .it img{width:28px;height:28px;vertical-align:-8px;margin-right:6px}
.credit{margin:10px 0 0;font-size:.78rem;color:var(--muted)}
.it.npc img{width:22px;height:26px;object-fit:contain;object-position:bottom}
.it.mob img{width:28px;height:24px}
.info{padding:14px 22px 16px;border-bottom:1px solid var(--line);background:var(--panel2);display:grid;gap:12px}
.info > div,.wrap > *,#main{min-width:0}
.info h3{font-family:var(--display);font-weight:500;font-size:.82rem;color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.tiles{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tile{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.8rem;line-height:1.3;text-decoration:none;color:var(--ink);font-family:var(--body)}
.tile:hover{border-color:var(--maple)}
.tile .nm{font-weight:500}
.tile .mt{color:var(--muted);font-size:.72rem}
.tile.map{width:168px;cursor:zoom-in}
.tile.map .pic{width:150px;height:112px;display:flex;align-items:center;justify-content:center;background:var(--sky);border-radius:6px;overflow:hidden}
.tile.map img{max-width:100%;max-height:100%;object-fit:contain}
.tile.map .nopic{color:var(--muted);font-size:.72rem;padding:6px}
.tile.npc{width:96px}
.tile.npc .pic{height:72px;display:flex;align-items:flex-end;justify-content:center}
.tile.npc img{max-height:72px;max-width:84px;object-fit:contain}
.tile.mob{width:116px}
.tile.mob .pic{height:64px;display:flex;align-items:flex-end;justify-content:center}
.tile.mob img{max-height:64px;max-width:104px;object-fit:contain}
.lvchip{display:inline-block;background:var(--t-kill);color:var(--tagInk);border-radius:999px;padding:0 7px;font-size:.7rem;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,18,34,.78);padding:24px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox figure{margin:0;max-width:min(92vw,720px);text-align:center;color:#fff}
.lightbox img{width:min(86vw,720px);height:min(75vh,520px);object-fit:contain;background:#BFD8EE;border-radius:10px;padding:8px;image-rendering:auto}
.lightbox figcaption{margin-top:10px;font-family:var(--display)}
.lightbox a{color:#FFD7A8}
@media (max-width:600px){.info{padding:12px 14px}.tile.map{width:140px}.tile.map .pic{width:122px;height:92px}}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);border-radius:999px;padding:5px 14px;font-size:.9rem;cursor:pointer;font-family:var(--display)}
.tabs button[aria-selected="true"]{background:var(--maple);border-color:var(--maple);color:#fff}
#opt{display:none;max-width:1180px;margin:0 auto;padding:18px 16px 60px}
body[data-tab="opt"] #opt{display:block}
body[data-tab="opt"] .ribbon, body[data-tab="opt"] .wrap, body[data-tab="opt"] .nav, body[data-tab="opt"] #openDrawer{display:none !important}
.side{top:162px !important;max-height:calc(100vh - 182px) !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
.optbox{margin:4px 14px 14px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--panel2)}
.optbox-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-weight:500;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.optbox ul{list-style:none;margin:0;padding:0}
.optbox li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:.92rem;border-bottom:1px dotted var(--line)}
.optbox li:last-child{border-bottom:0}
.linkbtn{background:none;border:0;color:var(--t-travel);cursor:pointer;font-size:.85rem;padding:2px 4px}
.ok-tag{flex:0 0 auto;display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;margin-top:2px;border:1px solid currentColor;white-space:nowrap}
.ok-tag.rare{color:var(--maple)} .ok-tag.drop{color:var(--t-kill)} .ok-tag.quest{color:var(--t-turnin)} .ok-tag.craft{color:var(--t-craft)} .ok-tag.buy{color:var(--t-gear)} .ok-tag.sell{color:var(--t-stop)}
.cf{display:inline-block;font-size:.72rem;font-weight:600;background:var(--t-collect);color:var(--tagInk);border-radius:999px;padding:0 6px;margin-left:2px;vertical-align:1px;white-space:nowrap}
.opt-intro{padding:18px 22px}
.opt-intro h2,.osec h2{font-family:var(--display);font-weight:500;margin:0 0 8px}
.osec{margin-top:26px;scroll-margin-top:120px}
.osec h2{font-size:1.35rem}
.legend{font-size:.88rem;color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;color:var(--ink);text-decoration:none}
.toc a:hover{border-color:var(--maple)}
.band{margin-bottom:14px}
.band.pad{padding:14px 18px}
.band h3,.sub-h{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 8px}
.pad-h{padding:14px 18px 0}
.band h4{font-family:var(--display);font-weight:500;font-size:.92rem;margin:10px 0 4px;color:var(--muted)}
.band-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px 6px}
.band.pad .band-h{padding:0 0 6px}
.band-h .lv{font-size:1.5rem}
.prow{display:grid;grid-template-columns:110px 1.2fr 1fr;gap:10px;padding:9px 18px;border-top:1px solid var(--line);font-size:.92rem;align-items:start}
.prow.phead{font-family:var(--display);color:var(--muted);font-size:.82rem;border-top:0;padding-top:4px;padding-bottom:4px}
.prow.w{grid-template-columns:60px 1fr 1.1fr 1.3fr 1fr}
.prow.c5{grid-template-columns:1fr 1fr .8fr 1.6fr .9fr}
.prow.c4{grid-template-columns:1fr .8fr 1.5fr 1.6fr}
.prow.c3{grid-template-columns:1.3fr 1.4fr .8fr}.prow.c2{grid-template-columns:.8fr 2fr}
.prow.w.buy .pc4{font-weight:600;color:var(--t-gear)}
.pc0{font-weight:500}
.onote{font-size:.9rem;color:var(--muted);margin:8px 2px}
.olist{margin:0;padding-left:18px}
.olist li{margin:5px 0;font-size:.93rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;gap:10px;align-items:center}
.mhead img{width:64px;height:56px;object-fit:contain;flex:0 0 auto}
.mcard .nm{font-weight:600}
.mrow{display:flex;gap:8px;font-size:.88rem;align-items:flex-start}
.stepchip{border:1px solid var(--line);background:var(--panel2);border-radius:6px;font-size:.75rem;padding:0 6px;margin:2px 2px 0 0;cursor:pointer;color:var(--ink)}
.stepchip:hover{border-color:var(--maple)}
.expgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.expc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;font-size:.85rem}
.timeline{list-style:none;margin:0 0 14px;padding:0 0 0 14px;border-left:3px solid var(--maple)}
.timeline li{position:relative;margin:0 0 14px;padding-left:12px}
.timeline li::before{content:"";position:absolute;left:-23px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--maple);border:2px solid var(--panel)}
.tl-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tl-h .lv{font-size:1.15rem}
@media (max-width:760px){
  .prow,.prow.w,.prow.c5,.prow.c4,.prow.c3,.prow.c2{grid-template-columns:1fr;gap:2px;padding:10px 14px}
  .prow.phead{display:none}
  .prow .pc0{font-family:var(--display);color:var(--maple)}
  .prow.w .pc0{color:var(--maple)}
  .optbox{margin:4px 8px 12px}
}

.mrow .it,.olist .it,.pc .it{white-space:normal}
a.dbl{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px}
a.dbl:hover{color:var(--maple);text-decoration-color:var(--maple)}
a.dbl.q{color:var(--t-turnin)}
.prow.g4{grid-template-columns:90px 1.15fr 1fr 1.15fr}
.prow.w{grid-template-columns:52px .9fr 1fr 1.1fr 1.2fr .9fr !important}
.rs{font-size:.8rem;line-height:1.45;border-left:3px solid var(--line);padding:1px 0 1px 7px;margin:0 0 4px}
.rs.must{border-color:var(--t-collect)} .rs.near{border-color:var(--t-talk)} .rs.no{border-color:var(--t-kill);color:var(--muted)} .rs.na{color:var(--muted)}
.rs.inl{display:inline-block;border:0;border-radius:6px;padding:0 6px;margin:0;font-weight:600;color:var(--tagInk)}
.rs.inl.must{background:var(--t-collect)} .rs.inl.near{background:var(--t-talk)} .rs.inl.no{background:var(--t-stop)}
@media (max-width:760px){.prow.g4,.prow.w{grid-template-columns:1fr !important}}
#intro{display:none;max-width:1000px;margin:0 auto;padding:18px 16px 60px}
body[data-tab="intro"] #intro{display:block}
body[data-tab="intro"] .ribbon, body[data-tab="intro"] .wrap, body[data-tab="intro"] .nav, body[data-tab="intro"] #openDrawer{display:none !important}
.intro-hero{padding:20px 22px}

.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.hero-grid > div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
.hero-grid h3{font-family:var(--display);font-weight:500;font-size:.95rem;margin:0 0 4px;color:var(--maple)}

.two .band{margin:0}
.pro h3{color:var(--t-collect)} .con h3{color:var(--t-kill)}
.steps{margin:0;padding-left:22px}
.steps li{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 8px;font-size:.93rem}
.rule{background:var(--panel2);border-left:4px solid var(--maple);padding:8px 12px;border-radius:6px;font-size:.95rem}
#intro .band.pad .prow{padding-left:0;padding-right:0}
.legend-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.legend-tags .tag{margin:0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}

.cta{text-align:center;margin:18px 0 6px}
.lvl{display:inline-block;font-size:.75rem;font-weight:600;border-radius:6px;padding:0 7px;color:var(--tagInk)}
.lvl.hi{background:var(--t-kill)} .lvl.mid{background:var(--t-talk)} .lvl.lo{background:var(--t-stop)}
.bar-btn.big{background:var(--maple);border-color:var(--maple);color:#fff;font-size:1rem;padding:10px 22px}
@media (max-width:760px){.hero-grid,.two{grid-template-columns:1fr}}
.navbox{margin:0;border-bottom:1px solid var(--line);padding:12px 22px 14px}
.navbox summary{cursor:pointer;font-family:var(--display);font-weight:500;font-size:1rem}
.navbox summary .mt{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.navlegend{font-size:.78rem;color:var(--muted);margin:6px 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navlist{list-style:none;counter-reset:nv;margin:6px 0 0;padding:0}
.nv{counter-increment:nv;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 0 8px 30px;border-top:1px dotted var(--line);position:relative;font-size:.92rem}
.nv:first-child{border-top:0}
.nv::before{content:counter(nv);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:.75rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.nvk{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:0 7px;margin-right:4px;color:var(--tagInk);vertical-align:1px}
.nvk.cab{background:var(--t-travel)} .nvk.walk{background:var(--t-collect)} .nvk.npc{background:var(--t-talk)} .nvk.txt{background:var(--t-note)}
.mm{position:relative;display:block;width:min(170px, calc(84px * var(--ar)));height:auto;padding:0;border:1px solid var(--line);border-radius:6px;background:#BFD8EE;cursor:zoom-in;overflow:hidden}
.mm img{width:100%;height:100%;object-fit:fill;display:block;image-rendering:pixelated}
.mm.big{width:min(460px,80vw, calc(70vh * var(--ar)));cursor:zoom-out;grid-column:1 / -1;justify-self:start}
.nv:has(.mm.big){grid-template-columns:1fr}
.mmdot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.mm.big .mmdot{width:16px;height:16px;margin:-8px 0 0 -8px}
.mmdot.st{position:static;display:inline-block;margin:0;width:10px;height:10px}
.mmdot.in{background:#2F6FD0} .mmdot.out{background:#E2711D} .mmdot.np{background:#D1453B}
.mm .mmdot.out,.mm .mmdot.np{animation:mmp 1.4s ease-in-out infinite}
@keyframes mmp{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion: reduce){.mm .mmdot{animation:none}}
@media (max-width:600px){.navbox{padding:10px 14px}.mm{width:min(120px, calc(64px * var(--ar)))}}
.tile.npc{width:132px !important}
.npclink{display:flex;flex-direction:column;align-items:center;gap:2px;color:inherit;text-decoration:none}
.npcmap{position:relative;display:block;width:min(134px, calc(80px * var(--ar)));aspect-ratio:var(--ar);padding:0;border:1px solid var(--line);border-radius:6px;background:#BFD8EE;cursor:zoom-in;overflow:hidden}
.npcmap img{width:100%;height:100%;object-fit:fill;display:block}
.mmdot.np{background:#22C55E;border-radius:3px;border:2px solid #fff}
.lbmap{position:relative;width:min(86vw,720px, calc(72vh * var(--ar)));aspect-ratio:var(--ar);margin:0 auto;background:#BFD8EE;border-radius:10px;overflow:hidden}
.lightbox .lbmap img{width:100%;height:100%;object-fit:fill;display:block;padding:0;background:none;border-radius:0;image-rendering:pixelated;max-height:none}
.mmdot.big{width:20px;height:20px;margin:-10px 0 0 -10px;animation:mmp 1.4s ease-in-out infinite}
.scr{color:var(--muted);font-size:.85rem}
.etcbox{margin:4px 14px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--panel2)}
.etcbox summary{cursor:pointer;font-family:var(--display);font-weight:500;font-size:.95rem}
.etcbox summary .mt{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.enote{font-size:.8rem;color:var(--muted);margin:8px 0 4px;line-height:1.5}
.elist{list-style:none;margin:0;padding:0}
.eitem{padding:8px 0;border-bottom:1px dotted var(--line);font-size:.88rem}

.eh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:600}
.efrom{font-weight:400;font-size:.78rem;color:var(--muted)}
.ep{font-weight:400;font-size:.78rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.erec{margin:5px 0 0 10px;padding-left:8px;border-left:3px solid var(--t-craft);line-height:1.9}
.edisc{display:inline-block;font-size:.72rem;font-weight:600;color:var(--t-craft);border:1px solid currentColor;border-radius:6px;padding:0 6px;white-space:nowrap}
.edisc.sm{margin-left:3px;font-weight:500}
.x{font-size:.78rem;color:var(--muted);margin-left:1px}
.ecat{font-size:.72rem;color:var(--muted);margin-left:2px}
.ejob{font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 4px;white-space:nowrap}
.ejob.th{color:var(--maple);border-color:currentColor}
.ev{font-size:.72rem;font-weight:600;border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.up{background:#DCFCE7;color:#166534}.ev.dn{background:#FEE2E2;color:#991B1B}
.eu2{font-size:.8rem;color:var(--muted);margin-top:2px}
.emore,.enone{margin:4px 0 0 10px;font-size:.8rem;color:var(--muted)}
.etcbox .ev.up{} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.up{background:#14532D;color:#BBF7D0}:root:not([data-theme="light"]) .ev.dn{background:#7F1D1D;color:#FECACA}}
:root[data-theme="dark"] .ev.up{background:#14532D;color:#BBF7D0}:root[data-theme="dark"] .ev.dn{background:#7F1D1D;color:#FECACA}
.ew{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:0 8px;margin-bottom:2px;white-space:nowrap;color:var(--tagInk)}
.ew.own{background:var(--maple)} .ew.mat{background:var(--t-craft)} .ew.scr{background:var(--t-turnin)} .ew.arw{background:var(--t-collect)} .ew.eq{background:var(--t-gear)}
.erec.own{border-left-color:var(--maple)} .erec.scr{border-left-color:var(--t-turnin)} .erec.arw{border-left-color:var(--t-collect)} .erec.eq{border-left-color:var(--t-gear)}
.erec{line-height:1.75}
.ewarn{margin-top:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--maple);background:color-mix(in srgb, var(--maple) 9%, var(--panel));font-size:.82rem}
.ewarn ul{margin:4px 0 0;padding-left:18px}.ewarn li{margin:2px 0}

.acts-h{font-family:var(--display);font-weight:500;font-size:1rem;margin:14px 22px 0;color:var(--ink)}
.acts-h .mt{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.navbox{border-top:1px solid var(--line)}
.navbox > summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;margin:2px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--t-travel);font-weight:500}
.navbox > summary::-webkit-details-marker{display:none}
.navbox > summary::after{content:"▾ คลิกเพื่อแสดง";margin-left:auto;font-family:var(--body);font-size:.8rem;color:var(--muted)}
.navbox[open] > summary::after{content:"▴ ซ่อน"}
.navbox > summary:hover{border-color:var(--t-travel)}

/* เควสเสริม: แยกชั้นจาก route หลัก */
.tab:not(.sq) .tt{font-weight:500}
.tab.sq{padding:3px 8px 3px 30px;font-size:.8rem;color:var(--muted);line-height:1.3}
.tab.sq .n{flex:0 0 14px;font-size:.75rem}
.tab.sq[aria-current="step"]{background:var(--panel2);color:var(--ink);outline:1.5px dashed var(--t-turnin);outline-offset:-2px}
.sqtag{display:inline-block;font-size:.66rem;font-weight:600;color:var(--t-turnin);border:1px dashed currentColor;border-radius:5px;padding:0 4px;margin-right:4px;vertical-align:1px}
.sqbox{margin:6px 14px 14px;border:1.5px dashed var(--t-turnin);border-radius:var(--radius-sm);padding:8px 12px;background:color-mix(in srgb, var(--t-turnin) 5%, var(--panel))}
.sqbox h3{font-family:var(--display);font-weight:500;font-size:.9rem;margin:0 0 4px;color:var(--t-turnin)}
.sqbox h3 .mt{font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
.sqrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:4px 0;cursor:pointer;font-size:.88rem;color:var(--ink)}
.sqrow:hover{border-color:var(--t-turnin)}
.sqrow .go{margin-left:auto;color:var(--t-turnin);font-size:.8rem;white-space:nowrap}
.sqrow .ok{color:var(--t-collect);font-weight:600}
.card.sqcard{border:1.5px dashed var(--t-turnin)}
.sqhead{display:inline-block;font-size:.78rem;font-weight:600;color:#fff;background:var(--t-turnin);border-radius:6px;padding:1px 8px}

/* ป้าย EXP / meso */
.cx{display:inline-flex;align-items:center;gap:4px;box-sizing:border-box;height:1.5em;padding:0 7px 0 2px;margin:0 2px;border:1px solid;border-radius:999px;font-size:.86em;line-height:1;white-space:nowrap;vertical-align:-.2em;transition:transform .15s ease, box-shadow .15s ease;cursor:default}
.cx b{font-weight:700;font-variant-numeric:tabular-nums}
.cx small{font-size:.8em;font-weight:600;opacity:.8;margin-left:-1px}
.cx:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cx .ci{flex:0 0 auto;width:1.15em;height:1.15em;border-radius:50%;position:relative;font-size:inherit}
.cx.exp{background:#EEF9E3;color:#2D6A0E;border-color:#A6D97A}
.cx.exp .ci{background:radial-gradient(circle at 35% 30%,#D8FFB0 0 15%,#7FD13B 45%,#3E9A12 85%);box-shadow:inset 0 0 0 1px rgba(45,106,14,.55)}
.cx.exp .ci::after{content:"";position:absolute;inset:22%;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cx.meso{background:#FFF6D6;color:#7A5200;border-color:#F0C94A}
.cx.meso .ci{background:radial-gradient(circle at 35% 30%,#FFF7C2 0 15%,#FFD23F 45%,#E09A00 80%,#A86A00);box-shadow:inset 0 0 0 1px rgba(122,82,0,.55)}
.cx.meso .ci::after{content:"";position:absolute;inset:26%;border-radius:50%;border:1.5px solid rgba(122,82,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cx.exp{background:#1D3A12;color:#C6F2A2;border-color:#4C8A2A}:root:not([data-theme="light"]) .cx.meso{background:#3A2E08;color:#FFE08A;border-color:#9C7A1C}}
:root[data-theme="dark"] .cx.exp{background:#1D3A12;color:#C6F2A2;border-color:#4C8A2A}
:root[data-theme="dark"] .cx.meso{background:#3A2E08;color:#FFE08A;border-color:#9C7A1C}
@media (prefers-reduced-motion: reduce){.cx{transition:none}.cx:hover{transform:none}}

/* equipment window */
.eqwin{width:300px;max-width:100%;background:var(--eq-frame);border:2px solid var(--eq-edge);border-radius:10px;padding:8px 10px 10px;box-shadow:0 2px 0 var(--eq-edge)}

.eqc.it-slot img{width:78%;height:78%;object-fit:contain;image-rendering:pixelated}
.eqc.opt{border-style:dashed;border-color:var(--eq-lbl)}
.eqnew{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--maple);box-shadow:0 0 0 1.5px #fff}
.equp{position:absolute;bottom:1px;right:2px;font-style:normal;font-size:.55rem;color:var(--t-collect);line-height:1}
.eqopt{display:inline-block;width:12px;height:12px;border:1.5px dashed var(--eq-lbl);border-radius:3px}
.eqnew.st,.equp.st,.eqopt.st{position:static;display:inline-block;vertical-align:-1px;margin-right:4px}
.eqleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.72rem;color:var(--eq-lbl)}
/* bracket detail */
.gside{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 18px}

.gtot > div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.gtot span{display:block;font-size:.74rem;color:var(--muted)}
.gtot b{font-size:.86rem;font-variant-numeric:tabular-nums}
@media (max-width:520px){.gtot{grid-template-columns:1fr}}

.gr-ic{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;cursor:help;padding:0}
.gr.new .gr-ic{border-color:var(--maple);box-shadow:0 0 0 1px var(--maple)}
.gr-ic img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
.gr-tx{min-width:0;font-size:.88rem}
.gr-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.gr-slot{font-size:.74rem;color:var(--muted);min-width:3.4em}
.gr-m{font-size:.8rem;color:var(--muted);margin-top:2px}
.gr-note{font-size:.8rem;margin-top:2px}
.gr-alt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.78rem;color:var(--muted);margin-top:4px}
.galt{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 3px;font-size:.78rem;color:var(--ink);cursor:help}
.galt img{width:20px;height:20px;object-fit:contain}
.gchip{font-size:.7rem;font-weight:600;border-radius:999px;padding:0 8px;white-space:nowrap}
.gchip.new{background:var(--maple);color:#fff} .gchip.keep{background:var(--panel2);color:var(--muted);border:1px solid var(--line)} .gchip.opt{border:1px dashed var(--muted);color:var(--muted)}
/* in-game style tooltip */
.gtip{position:fixed;z-index:80;width:272px;max-width:calc(100vw - 16px);background:var(--tt-bg);color:var(--tt-ink);border:1px solid var(--tt-edge);border-radius:6px;padding:10px 12px;font:12px/1.45 var(--body);box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
.gtip .tt-name{font-weight:700;font-size:14px;text-align:center}
.gtip .tt-sub{text-align:center;color:var(--tt-on);font-size:11px}
.gtip .tt-top{display:grid;grid-template-columns:76px 1fr;gap:10px;margin-top:8px}
.gtip .tt-ic{width:76px;height:76px;background:rgba(255,255,255,.92);border-radius:6px;display:flex;align-items:center;justify-content:center}
.gtip .tt-ic img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.gtip .tt-req{font-size:11px;letter-spacing:.02em}
.gtip .tt-req .no{color:var(--tt-no)}
.gtip .tt-jobs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px;font-size:10px;font-weight:700;color:var(--tt-dim)}
.gtip .tt-jobs .on{color:var(--tt-on)}
.gtip .tt-stats{border-top:1px dotted var(--tt-edge);padding-top:6px;font-size:11px;letter-spacing:.02em}
.gtip .gold{color:var(--tt-on)}
.gtip .tt-guide{border-top:1px dotted var(--tt-edge);margin-top:6px;padding-top:6px;color:var(--tt-guide);display:grid;gap:3px}
.gtip .tt-guide b{color:var(--tt-ink)}
.gtip .tt-use{color:var(--tt-on)}
.gtip .tt-lv{font-size:10.5px;color:var(--tt-dim)}
/* intro job path */
.jpath{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;margin:0;padding:0;counter-reset:jp}
.jpath li{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0;position:relative}
.jpath li.here{border-color:var(--maple)}
.jpath li.later{opacity:.75;border-style:dashed}
.jpath .jl{font-family:var(--display);color:var(--maple);font-size:.85rem}
.jpath h3{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0 0 4px}
.jpath p{margin:0;font-size:.88rem}
@media (max-width:760px){.jpath{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.jpath{grid-template-columns:1fr}}
.btbl table.aptbl{min-width:900px}
#btable .btbl table{min-width:980px}
.bprice{min-width:150px}
.bp{font-size:.8rem;line-height:1.45;margin-top:2px}
.bpl{display:inline-block;font-size:.7rem;font-weight:600;color:var(--t-gear);margin-right:5px}
.bpl.fm{color:var(--t-collect)}
.bp small{color:var(--muted)}
.gr-price{margin-top:2px}
.gr.alt{margin-left:30px;grid-template-columns:36px 1fr;border-top:1px dashed var(--line);padding:6px 0}
.gr.alt .gr-ic{width:36px;height:36px;border-style:dashed}
.gr.alt .gr-ic img{width:26px;height:26px}
.gchip.alt{border:1px solid var(--t-talk);color:var(--t-talk)}
tr.altrow td{background:color-mix(in srgb, var(--t-talk) 6%, transparent)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lgrid > div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;min-width:0}
.lgrid p{margin:4px 0 0;font-size:.86rem}
.gtip .tt-k .gk{border-color:currentColor}
.gtip .tt-k .gk.start{color:#8FB8FF}.gtip .tt-k .gk.buy{color:#F2B27A}.gtip .tt-k .gk.drop{color:#FF9A92}.gtip .tt-k .gk.quest{color:#C9A8FF}.gtip .tt-k .gk.craft{color:#7FDCE8}.gtip .tt-k .gk.none{color:#B9C0CC}
.gtip .bp small{color:var(--tt-guide)}
.gtip .bpl{color:#F2B27A}.gtip .bpl.fm{color:#8FE3A8}
@media (max-width:520px){.gr.alt{margin-left:12px}}
.gtip .tt-guide .cx b{color:inherit}
.bnr{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}.bnr .bst{line-height:1.5}

/* ---------- Grind tab ---------- */
#grind{display:none;max-width:1180px;margin:0 auto;padding:18px 16px 60px}
body[data-tab="grind"] #grind{display:block}
body[data-tab="grind"] .ribbon, body[data-tab="grind"] .wrap, body[data-tab="grind"] .nav, body[data-tab="grind"] #openDrawer{display:none !important}

.gpace label{font-weight:600}

.gtl-b small{font-size:.68rem;opacity:.9;white-space:nowrap}
.gtl-b.s0{background:#3E8E5A}.gtl-b.s1{background:#8A5BB8}.gtl-b.s2{background:#C4532E}.gtl-b.s3{background:#2F78B7}.gtl-b.s4{background:#1F5E8F}
.gtl-t{position:absolute;bottom:2px;transform:translateX(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}

.gstage .card{overflow:hidden}
.gs-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.gs-head h2{font-family:var(--display);font-weight:500;font-size:1.45rem;line-height:1.3;margin:8px 0 6px}
.gs-body{padding:14px 18px 18px}
.gkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.gkpi > div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.gkpi > div > span{display:block;font-size:.8rem;color:var(--muted)}
.gkpi b{display:block;font-family:var(--display);font-weight:600;font-size:1.35rem;color:var(--maple);font-variant-numeric:tabular-nums;line-height:1.3}

.gtbl{min-width:700px}
.gmob{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.gmob img{width:40px;height:34px;object-fit:contain}
.gmaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:10px}
.gmap{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;color:var(--ink);text-decoration:none;min-width:0}
.gmap:hover{border-color:var(--maple)}
.gmap .pic{cursor:pointer}

.gmap .pic img{max-width:100%;max-height:100%;object-fit:contain}
.gmap .nopic{font-size:.7rem;color:var(--muted);padding:4px;text-align:center}
.gm-tx{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:.86rem;line-height:1.35}

.gm-tx .gchip{align-self:flex-start}
.gm-note{color:var(--muted);font-size:.8rem}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.altplan{border-color:var(--t-talk)}

<body>
<header class="bar">
  <div class="bar-inner">
    <button class="bar-btn only-mobile" id="openDrawer" aria-label="เปิดรายการขั้นตอนทั้งหมด">ทุกขั้นตอน</button>

<script>
/* ---------- Route data ----------

const WORD_RE = mkRe(Object.keys(ICON).concat(Object.keys(ALIAS), Object.keys(MOB), Object.keys(QUEST_URL)));
const MAP_RE = mkRe(Object.keys(MAP).concat(Object.keys(MAP_ALIAS)));
const NPC_B_RE = new RegExp("<b>(" + Object.keys(NPC).sort((a,b)=>b.length-a.length).map(reEsc).join("|") + ")</b>", "g");
const attr = s => String(s).replace(/&/g,"&amp;").replace(/"/g, "&quot;").replace(/</g,"&lt;");
const lk = (u, inner, cls) => u ? `<a class="dbl ${cls||""}" href="${u}" target="_blank" rel="noopener">${inner}</a>` : inner;
const ico = h => h == null ? h : String(h)
  .replace(NPC_B_RE, (m, n) => lk(NPC[n].u, `<b class="it npc"><img src="${NPC[n].i}" alt="" title="NPC: ${attr(n)}">${n}</b>`))
  .split(/(<[^>]*>|The Pig Beach|Pale Maple Leaf|Reddened Maple Leaf)/).map(p => (p.startsWith("<") || /^(The Pig Beach|Pale Maple Leaf|Reddened Maple Leaf)$/.test(p)) ? p : p.replace(WORD_RE, n => {
    if (MOB[n]) return lk(MOB[n].u, `<span class="it mob"><img src="${MOB[n].i}" alt="" title="${attr(n)} · Lv ${MOB[n].lv}">${n}</span>`) + (MOB[n].lv ? `<span class="mlv" title="เลเวลมอน">Lv ${MOB[n].lv}</span>` : "");
    if (ICON[ALIAS[n]||n]) return lk(ITEM_URL[n], `<span class="it"><img src="${ICON[ALIAS[n]||n]}" alt="" title="${attr(n)}">${n}</span>`);
    return lk(QUEST_URL[n], n, "q");
  })).join("");
const itemIco = n => { const k = ALIAS[n] || n; return ICON[k] ? lk(ITEM_URL[n], `<span class="it"><img src="${ICON[k]}" alt="" title="${attr(n)}">${esc(n)}</span>`) : lk(ITEM_URL[n], esc(n)); };
const plain = h => String(h||"").replace(/<[^>]*>/g, " ");
function stepInfo(s){
  const npcs = new Set(), mobs = new Set(), maps = new Set();
  const texts = [s.intro, s.keep, ...s.act.flatMap(a => [a.x, a.tip, a.from, ...(a.sub||[])])];
  texts.forEach(t => {
    if (!t) return;
    for (const m of String(t).matchAll(NPC_B_RE)) npcs.add(m[1]);
    for (const m of plain(t).matchAll(WORD_RE)) if (MOB[m[1]]) mobs.add(m[1]);
  });
  const w = String(s.where).match(/NPC (.+)$/); if (w && NPC[w[1].trim()]) npcs.add(w[1].trim());
  [s.where, ...s.act.map(a => a.map)].forEach(t => { if (t) for (const m of String(t).matchAll(MAP_RE)) maps.add(MAP_ALIAS[m[1]] || m[1]); });
  return {npcs:[...npcs], mobs:[...mobs], maps:[...maps]};
}
function infoHTML(s){
  const {npcs, mobs, maps} = stepInfo(s);
  if (!npcs.length && !mobs.length && !maps.length) return "";
  const grp = (title, tiles) => tiles.length ? `<div><h3>${title}</h3><div class="tiles">${tiles.join("")}</div></div>` : "";
  return `<section class="info" aria-label="ภาพประกอบขั้นนี้">
    ${grp("แมพ (แตะเพื่อขยาย)", maps.map(n => { const m = MAP[n]; return `<button type="button" class="tile map" data-map="${attr(n)}"><span class="pic">${m.i?`<img src="${m.i}" alt="ภาพแมพ ${attr(n)}">`:`<span class="nopic">ไม่มีภาพแมพ</span>`}</span><span class="nm">${esc(n)}</span><span class="mt">${esc(m.s || m.r)}</span></button>`; }))}
    ${grp("NPC (แตะแผนที่เพื่อดูตำแหน่ง)", npcs.map(n => `<div class="tile npc"><a class="npclink" href="${NPC[n].u}" target="_blank" rel="noopener"><span class="pic"><img src="${NPC[n].i}" alt=""></span><span class="nm">${esc(n)}</span></a>${npcMapThumb(n)}<span class="mt">${esc((NPCLOC[n]||{}).t||NPC[n].s)}</span></div>`))}
    ${grp("มอนสเตอร์", mobs.map(n => { const m = MOB[n]; return `<a class="tile mob" href="${m.u}" target="_blank" rel="noopener"><span class="pic"><img src="${m.a||m.i}" alt=""></span><span class="nm">${esc(n)} <span class="lvchip">Lv ${m.lv}</span></span><span class="mt">HP ${m.hp} · EXP ${m.exp}</span></a>`; }))}
  </section>`;
}
function openMap(n){
  const m = MAP[n]; if (!m) return;
  $("lbBody").innerHTML = `${m.i?`<img src="${m.i}" alt="ภาพแมพ ${attr(n)}">`:""}<figcaption>${esc(n)}${m.s?` · ${esc(m.s)}`:""}<br><a href="${m.u}" target="_blank" rel="noopener">ดูข้อมูลแมพบน NiaMeowDB ↗</a></figcaption>`;
  $("lightbox").classList.add("open");

const QUEST_ROUTE_ALIAS = {"Collecting 200 Cursed Dolls":"Collecting 50 Cursed Dolls"};
let RS = null;
function routeIndex(){
  if (RS) return RS;
  RS = {must:{}, mapSteps:{}, qAct:{}, qOpt:{}};
  const add = (o,k,i) => { (o[k]=o[k]||[]); if (!o[k].includes(i)) o[k].push(i); };
  S.forEach((s,i)=>{
    s.act.forEach(a=>{
      const t = plain([a.x,a.tip,...(a.sub||[])].join(" "));
      if (a.t==="kill" || a.t==="collect") for (const m of plain(a.x+" "+(a.from||"")).matchAll(WORD_RE)) if (MOB[m[1]]) add(RS.must,m[1],i);
      for (const m of t.matchAll(WORD_RE)) if (QUEST_URL[m[1]]) add(RS.qAct,m[1],i);
    });
    (s.opt||[]).forEach(o=>{ for (const m of plain(o.x).matchAll(WORD_RE)) if (QUEST_URL[m[1]]) add(RS.qOpt,m[1],i); });
    stepInfo(s).maps.forEach(mp=>add(RS.mapSteps,mp,i));
  });
  /* Line 1 <Area 1> is the subway map between Transfer Area and Line 1 <Area 2> — passed on the way */
  [27,37].forEach(i=>add(RS.mapSteps,"Line 1 <Area 1>",i));
  return RS;
}
const stepBtns = st => st.slice(0,5).map(i=>`<button type="button" class="stepchip" data-go="${i}">${i+1}</button>`).join("");
function mobStatus(n){
  const R = routeIndex();
  if (R.must[n]) return {k:"must", st:R.must[n]};
  for (const mp of (MOB_MAPS[n]||[])) if (R.mapSteps[mp]) return {k:"near", st:R.mapSteps[mp], map:mp};
  return {k:"no"};
}
function questStatus(q){
  const R = routeIndex(); const qq = QUEST_ROUTE_ALIAS[q] || q;
  if (R.qAct[qq]) return {k:"must", st:R.qAct[qq]};
  if (R.qOpt[q]) return {k:"near", st:R.qOpt[q]};
  return {k:"no"};
}
function statusChips(cell){
  const seen = new Set(), out = [];
  for (const m of plain(cell).matchAll(WORD_RE)){
    const n = m[1]; if (seen.has(n)) continue; seen.add(n);
    if (MOB[n]){ const r = mobStatus(n);
      out.push(r.k==="must" ? `<div class="rs must"><b>${esc(n)}</b>: ต้องตีอยู่แล้ว · ขั้น ${stepBtns(r.st)}</div>`
        : r.k==="near" ? `<div class="rs near"><b>${esc(n)}</b>: อยู่แมพที่ผ่าน แวะตีได้ (${esc(r.map)}) · ขั้น ${stepBtns(r.st)}</div>`
        : `<div class="rs no"><b>${esc(n)}</b>: ไม่ผ่าน</div>`);
    } else if (QUEST_URL[n] && !ICON[n]){ const r = questStatus(n);
      out.push(r.k==="must" ? `<div class="rs must"><b>${esc(n)}</b>: เควสใน route · ขั้น ${stepBtns(r.st)}</div>`
        : r.k==="near" ? `<div class="rs near"><b>${esc(n)}</b>: เควสเสริม ทำได้ระหว่างขั้น ${stepBtns(r.st)}</div>`
        : `<div class="rs no"><b>${esc(n)}</b>: ไม่อยู่ใน route (เควสเสริม)</div>`);
    }
  }
  if (!out.length) return /ซื้อ|คราฟต์/.test(cell) ? `<div class="rs na">ซื้อ / คราฟต์ ไม่เกี่ยวกับมอน</div>` : `<div class="rs na">—</div>`;
  return out.join("");
}

function mmHTML(o){
  const m = MINI[o.m]; if (!m || !o.b) return "";
  const dot = (p,c,l) => p ? `<span class="mmdot ${c}" style="left:${p[0]}%;top:${p[1]}%" title="${l}"></span>` : "";
  return `<button type="button" class="mm" aria-label="ขยายแผนที่" style="--ar:${(m.w/m.h).toFixed(3)};aspect-ratio:${m.w}/${m.h}"><img src="${m.u}" alt="" loading="lazy">${dot(o.a,"in","จุดที่เข้ามา")}${dot(o.b,o.k==="npc"?"np":"out",o.k==="npc"?"NPC":"ทางออก")}</button>`;
}
function navHTML(i){
  const L = NAV[i]; if (!L || !L.length) return "";
  return `<details class="navbox"><summary>🧭 เส้นทางเดินของขั้นนี้ <span class="mt">(${L.length} จุด แตะแผนที่เพื่อขยาย)</span></summary>
    <p class="navlegend"><span class="mmdot in st"></span> จุดที่เข้ามา <span class="mmdot out st"></span> ทางออกที่ต้องไป <span class="mmdot np st"></span> ตำแหน่ง NPC</p>
    <ol class="navlist">${L.map(o=>`<li class="nv ${o.k}"><div class="nvt"><span class="nvk ${o.k}">${NAVK[o.k]}</span> ${ico(o.t)}</div>${mmHTML(o)}</li>`).join("")}</ol></details>`;
}

function npcMapThumb(n){

}
function openNpcMap(n){
  const L = NPCLOC[n], m = L && MINI[L.m]; if (!m) return;
  $("lbBody").innerHTML = `<div class="lbmap" style="--ar:${(m.w/m.h).toFixed(3)}"><img src="${m.u}" alt="แผนที่"><span class="mmdot np big" style="left:${L.p[0]}%;top:${L.p[1]}%"></span></div><figcaption><b>${esc(n)}</b> — ${esc(L.t)}${NPC[n]?`<br><a href="${NPC[n].u}" target="_blank" rel="noopener">ดูบน NiaMeowDB ↗</a>`:""}</figcaption>`;
  $("lightbox").classList.add("open");
}

let MOB_STEPS = null;
function mobSteps(){
  if (MOB_STEPS) return MOB_STEPS;
  MOB_STEPS = {};
  S.forEach((s,i)=>stepInfo(s).mobs.forEach(m=>{(MOB_STEPS[m]=MOB_STEPS[m]||[]).push(i)}));
  return MOB_STEPS;

function rareSectionHTML(){
  const name = r => (ITEM_URL[r[0]] ? ico(r[0]) : (r[8] ? lk(r[8], `<b>${esc(r[0])}</b>`) : `<b>${esc(r[0])}</b>`));
  const status = r => { for (const m of r[2]) { const s = mobStatus(m); if (s.k!=="no") return {m, ...s}; } return {k:"no"}; };
  const row = r => { const st = status(r);
    const chip = st.k==="must" ? `<span class="rs must inl">ต้องตีอยู่แล้ว</span> ${esc(st.m)} ขั้น ${stepBtns(st.st)}`
      : st.k==="near" ? `<span class="rs near inl">แวะตีได้</span> <span class="mt">${esc(st.map)}</span> ขั้น ${stepBtns(st.st)}`
      : `<span class="rs no inl">ไม่ผ่าน route</span>`;
    return `<div class="prow r9"><div class="pc">${name(r)}<div class="mt">${esc(r[1])}</div></div><div class="pc">${ico(r[2].join(", "))}<div class="mt">${esc(r[3])}</div></div><div class="pc">${esc(r[4])}</div><div class="pc"><span class="tier">${esc(r[5])}</span></div><div class="pc">${esc(r[7])}</div><div class="pc">${chip}</div></div>`; };
  const on = RAREDATA.filter(r=>status(r).k!=="no"), off = RAREDATA.filter(r=>status(r).k==="no");
  const head = `<div class="prow phead r9"><div class="pc">ของ</div><div class="pc">ดรอปจาก / แมพ</div><div class="pc">เรทดรอป</div><div class="pc">ความต้องการ</div><div class="pc">สำหรับ Sindit</div><div class="pc">ผ่านใน route?</div></div>`;
  return `<section id="o-rare" class="osec"><h2>ของมีราคา (ดรอปหายาก)</h2>
    <p class="onote">ของที่ขายได้ราคาดีหรือ Sindit ใช้เอง <b>อย่าหยุดเลเวลเพื่อฟาร์มอย่างเดียว</b> — ตีมอนตาม route แล้วลุ้นไปด้วย เรทดรอปไม่เป็นทางการ (อิงข้อมูล rare-drop ช่วงเทสต์) · ราคาตลาดจริงยังไม่มีข้อมูล ช่อง "ความต้องการ" เป็นการประเมินเท่านั้น</p>
    <h3 class="sub-h">ผ่านระหว่าง route — ลุ้นได้ฟรี</h3><div class="card band">${head}${on.map(row).join("")}</div>
    <h3 class="sub-h">ไม่ผ่าน route — ต้องแวะไปเฉพาะ</h3><div class="card band">${head}${off.map(row).join("")}</div>
  </section>`;
}

ส่ของ แผนนี้ลง DEX เร็วช่วงเลเวล 20–24 เพื่อใส่ Meba แล้วลงเลเวลละ 1 ที่เลเวล 44 จะมี DEX 45 พอใส่ Gephart (DEX 35) และ Shinkita (DEX 45) จึงไม่ต้องลง DEX เพิ่มจนถึงเลเวล 50","<b>STR และ INT ไม่ต้องลงเลย</b> มีดสาย STR (Cass, Bazlud, Sai) จึงใส่ไม่ได้","<b>ถ้าขึ้น MISS บ่อย</b> ให้เก็บเลเวลก่อน อย่าลง DEX เพิ่ม เพราะเลเวลของตัวละครช่วยเรื่องความแม่นได้มากกว่า"],"apNote":"ถ้าลงสเตตัสผิด แก้ได้ด้วยม้วน AP Reset ราคา 7,000 NX (ใช้ได้ตั้งแต่เลเวล 10) เกมจะไม่รีเซ็ตสเตตัสให้เองตอนเปลี่ยนอาชีพ","spRules":["<b>ตอนเป็น Beginner</b> ถึงเลเวล 10 จะได้ 9 แต้ม ให้ลง Three Snails, Recovery และ Nimble Feet สกิลละ 3 แต้ม","<b>ขั้นแรก 61 SP</b> Lucky Seven 20 → Nimble Body 15 → Keen Eyes 3 → Disorder 3 → Dark Sight 20 <b>ไม่ลง Double Stab</b> ทั้งหมดต้องลงให้จบภายในเลเวล 30 เพราะแต้มขั้นสองเอามาลงสกิลขั้นแรกไม่ได้","<b>Keen Eyes ลงแค่ 3</b> เพื่อเหลือแต้มให้ Dark Sight เต็ม 20 ซึ่งยังใช้ได้หลังเปลี่ยนเป็นมีด","<b>ขั้นสอง (Bandit) ลงทันที ไม่ต้องเก็บ SP</b> เลเวล 30 ลง Haste 1 เพื่อได้บัฟวิ่งเร็ว (ใช้กับ claw ได้) แล้วเลเวล 31–37 ลง Dagger Mastery จนเต็ม 20 (Dagger Booster 1 ที่เลเวล 32) ตามด้วย Savage Blow ตั้งแต่เลเวล 38","<b>สกิลมีดที่ลงไว้ยังไม่ช่วยตอนปาดาว</b> แต่ไม่เสียอะไร เพราะเป็นแต้มที่ต้องลงอยู่แล้ว และพอได้มีดก็แรงทันที","<b>เปลี่ยนเป็นมีดได้เมื่อ</b> Dagger Mastery เต็ม 20 และ Savage Blow 11 ขึ้นไป (ฟัน 5 ครั้ง) คือตั้งแต่เลเวล 41 จะเปลี่ยนตอนไหนก็ได้หลังจากนั้น ขึ้นกับว่าอยากเปลี่ยนอาวุธหรือขาย claw กับดาวทิ้งตอนไหน"],"spTables":[{"t":"สกิลแต่ละตัวทำอะไร","head":["สกิล","สกิลนี้ทำอะไร","ลงตอนไหน"],"rows":[["Lucky Seven","ปาดาว 2 ลูกใส่มอนจากระยะไกล แต่ละลูกแรง 140% ท่าหลักตั้งแต่เลเวล 10 จนเปลี่ยนเป็นมีด","เลเวล 10–17 จนเต็ม 20"],["Nimble Body","เพิ่ม ACC และ Avoid ลด MISS ซึ่งสำคัญเพราะ MISS ทุกครั้งคือเสียดาวฟรี และยังช่วยหลังเปลี่ยนเป็นมีด","เลเวล 17–22 จนเต็ม 15"],["Keen Eyes","เพิ่มระยะปาดาว ลงแค่ 3 แต้มเพื่อเหลือแต้มให้ Dark Sight","เลเวล 22–23 ลง 3"],["Disorder","ลดพลังโจมตีของมอน ต้องมี 3 แต้มก่อนลง Dark Sight","เลเวล 23–24 ลง 3"],["Dark Sight","หายตัว ใช้หนีหรือเดินผ่านมอน ลงเต็มแล้วไม่เสียความเร็วและใช้ MP น้อยลง ใช้ได้ทั้งตอนปาดาวและตอนใช้มีด","เลเวล 24–30 จนเต็ม 20"],["Savage Blow","ฟันมอนตัวเดียว 4 / 5 / 6 ครั้งที่สกิล 1 / 11 / 21 ท่าหลักหลังเปลี่ยนเป็นมีด ใช้ได้เฉพาะมีด","เลเวล 38–47 จนเต็ม 30 (11 ที่เลเวล 41, 21 ที่เลเวล 44)"],["Dagger Mastery","บีบช่วงดาเมจของมีดให้แคบลง ขอบล่างสูงขึ้นมาก และคริ +20% ใช้ได้เฉพาะมีด","เลเวล 31–37 จนเต็ม 20 ลงก่อน Savage Blow"],["Dagger Booster","ตีด้วยมีดเร็วขึ้น 2 ขั้น 1 แต้มก็เร็วเต็มที่ ต้องมี Mastery 5","1 แต้มที่เลเวล 32"],["Haste","วิ่งเร็ว กระโดดสูง ใช้กับเพื่อนในปาร์ตี้ได้ ใช้ได้ทุกอาวุธ","1 แต้มที่เลเวล 30 (ลงเป็นตัวแรก) แล้วเลเวล 48–50 ถึง 8"],["Steal / Nimble Recovery","Steal ต้องมี Haste 5 ขโมยสำเร็จได้บัฟ Attack Power ส่วน Recovery ฟื้น HP/MP หลังหลบสำเร็จ","อย่างละ 1 แต้มที่เลเวล 49"]],"notes":["ลำดับการลงสกิลแบบเลเวลต่อเลเวลเขียนไว้ในช่อง SP ของแต่ละขั้นใน route แล้ว"]}],"gearNotes":["<b>ดาเมจของ Lucky Seven</b> คิดจาก LUK คูณกับ ATK รวมของ claw และดาว การเปลี่ยนดาวจาก Subi (+15) เป็น Wolbi (+17) จึงเพิ่มดาเมจได้พอๆ กับการอัปเกรด claw หนึ่งขั้น","<b>claw ที่ขายในร้าน NPC ตอนเปิดเกมมีแค่ 4 อัน</b> คือ Garnier, Steel Titans, Steel Igor และ Meba ที่ Cutthroat Manny ใน Kerning ตั้งแต่เลเวล 30 ขึ้นไปต้องคราฟต์หรือซื้อจากผู้เล่น","<b>claw ใส่โล่ไม่ได้</b> แต่ให้เก็บ Pan Lid ที่ดรอปจาก Green Mushroom ไว้ใช้ตอนเปลี่ยนเป็นมีด","<b>ตอนเปลี่ยนเป็นมีด</b> ขาย claw และดาวที่เหลือให้ผู้เล่นคนอื่น ถ้าขายต่อได้แทบไม่เสียเงิน ถ้าจะเปลี่ยนเป็นมีดตั้งแต่เลเวล 41 จะใช้ Dark Guardian แค่ช่วงสั้นๆ ใช้ Meba ต่อแล้วเก็บเงินซื้อมีดแทนก็ได้"],"create":["<b>เลือกสเตตัสแบบโจร (Thief):</b> STR 4, DEX 5, INT 4 และ <b>LUK 12</b> เกมให้แต้มมาทั้งหมด 25 แต้ม สเตตัสหลักได้ 12 สเตตัสรองได้ 5 ที่เหลือได้ 4","<b>เพศของตัวละคร:</b> โจรหญิงใส่ Dark Avenger (Overall เลเวล 35, LUK +6, 10 ช่องม้วน) ได้ ส่วนตัวละครชายไม่มีชุดที่ดีเทียบเท่า แต่ตอนนี้ยังไม่มีผู้เล่นยืนยันแหล่งดรอปของชุดนี้ใน Classic จึงไม่ต้องยึดเรื่องเพศมาก","<b>อาวุธเริ่มต้นให้เลือก Wooden Club</b> เพราะมีพลังโจมตี 19 สูงกว่า Sword และ Hand Axe ที่มี 17 ช่วงเลเวล 1 ถึง 4 จึงฆ่ามอนได้เร็วกว่า","<b>เลเวล 5 ให้เปลี่ยนเป็น Razor</b> ที่ได้จากเควส Biggs ถ้าได้ Fruit Knife มาแทนก็ใช้ได้เหมือนกัน เพราะพลังโจมตีเท่ากัน","<b>พอถึงเลเวล 10</b> ให้นั่งเรือไป Victoria Island แล้วไปหา Dark Lord ที่ Kerning City เพื่อเปลี่ยนเป็นโจร ซึ่งไม่ต้องมีสเตตัสขั้นต่ำ"],"apAlt":{"t":"แผนลง DEX เร็ว (ไม่บังคับ ใช้เงินเพิ่ม)","p":["Beginner's Garnier ที่เกมให้มี ATK 10 เท่ากับ Garnier ในร้าน ช่วงเลเวล 15–24 จึงอ่อนกว่า Steel Titans (ATK 13) และ Steel Igor (ATK 17) ที่ขายอยู่ที่ Cutthroat Manny แผนหลักของไกด์นี้ข้ามสอง claw นี้เพื่อประหยัดเงิน 21,100 meso และลง LUK ได้เต็มที่ก่อน","ถ้าเงินพอและอยากฆ่าเร็วขึ้นช่วงเลเวล 20–24 ให้ลง LUK อย่างเดียวถึงเลเวล 15 จากนั้นเลเวล 16–20 ลง DEX 3 และ LUK 2 ทุกเลเวล จะได้ DEX 20 ตอนเลเวล 20 พอดีสำหรับ Steel Igor แล้วเลเวล 21–25 ลง DEX 1 และ LUK 4 ทุกเลเวล","ดาเมจของ Lucky Seven ขึ้นกับ LUK คูณด้วย ATK รวมของ claw และดาว เมื่อคิดกับดาว Subi แผนนี้ทำดาเมจได้มากกว่าแผนหลักราว 14% ตอนเลเวล 20 และราว 29% ตอนเลเวล 24 ส่วนตั้งแต่เลเวล 25 ทั้งสองแผนมี LUK และ DEX เกือบเท่ากัน และใช้ Meba เหมือนกัน","ถ้าเลือกแผนนี้ ช่อง AP ในขั้นเลเวล 15–25 ของ route จะไม่ตรง ให้ยึดตัวเลขในกล่องนี้แทน"]},"spWhy":"<h3 class=\"sub-h\">ลง SP ขั้นสองยังไง</h3>\n  <div class=\"card band pad\">\n    <p>ตั้งแต่เลเวล 30 ได้ SP ขั้นสองเลเวลละ 3 แต้ม (เปลี่ยนอาชีพได้ 1 แต้ม) <b>ลงทันทีทุกเลเวล ไม่ต้องเก็บไว้</b> ลำดับเหมือนไกด์โจรมีด</p>\n    <ol class=\"steps\">\n      <li>Lv.30: Haste 1 เปิดบัฟวิ่งเร็วไว้ตลอด ใช้กับ claw ได้</li>\n      <li>Lv.31–37: Dagger Mastery จนเต็ม 20 (Lv.32 ลง Dagger Booster 1 ด้วย)</li>\n      <li>Lv.38–47: Savage Blow +3 ต่อเลเวลจนเต็ม 30 (Lv.41 ได้ 12 ฟัน 5 ครั้ง, Lv.44 ได้ 21 ฟัน 6 ครั้ง)</li>\n      <li>Lv.48: Haste 4 → Lv.49: Haste 5 / Steal 1 / Nimble Recovery 1 → Lv.50: Haste 8</li>\n      <li>ที่เลเวล 50 จะได้ Mastery 20 / Savage Blow 30 / Haste 8 / Booster 1 / Steal 1 / Recovery 1 รวม 61 SP เท่ากับแผนของไกด์โจรมีด หลังจากนั้นลงต่อตามทางเลือก A/B/C ในไกด์โจรมีด</li>\n    </ol>\n    <p><b>เปลี่ยนเป็นมีดได้ตั้งแต่เลเวล 41</b> คือหลัง Dagger Mastery เต็มและ Savage Blow ถึง 11 ขึ้นไป จะเปลี่ยนตอนไหนก็ได้หลังจากนั้น ขึ้นกับว่าอยากเปลี่ยนอาวุธ หรือขาย claw กับดาวทิ้งตอนไหน แต้มในสกิลมีดที่ลงไว้ระหว่างปาดาวยังไม่ได้ใช้ แต่ไม่เสียอะไรเพราะเป็นแต้มที่ต้องลงอยู่แล้ว</p>\n    <p><b>ทำไมลง Dagger Mastery ให้เต็มก่อน Savage Blow</b> Mastery บีบช่วงดาเมจให้แคบลง ขอบล่างขึ้นจากราว 32% เป็นราว 79% ของขอบบน ดาเมจเฉลี่ยเพิ่มราว 36% และได้คริ +20%</p>\n    <p class=\"onote\">อีกทางคือแบบของ MeowDB ที่ใช้ม้วนรีเซ็ตสกิล (7,000 NX) ตอนเลเวล 40 เพื่อแลก Lucky Seven เป็น Double Stab ไกด์นี้ไม่ใช้ทางนั้นเพราะต้องจ่ายเงินจริง</p>\n  </div>"},"items":{"Wooden Club":{"shop":{"npc":"Silver","town":"Lith Harbor","map":"Victoria Road: Lith Harbor Weapon Shop","price":50},"nshop":1,"id":585,"sub":"One-Handed Blunt Weapon","lv":0,"st":{"watk":19,"attackSpeed":5,"slots":7},"spd":"Fast","ic":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAeCAYAAAA/xX6fAAAByklEQVR4Ab3BC3lbMQyA0V/5QuBS8CCYgjCMwiB44ERBFExBELzIyc1tm7TNo9k5/CeDkx2vN5qSBgfCa42mTB5gDsLrjKZMHmBOEuE1RlMmDzAnCQfCzxtNmTzAnCScCD9rNGXyAHOS8IbwMwYHTZk8wJwkfCA8bzTlzAPMScIVwnNGU848wJwkfGLH40ZT0Fq4h/CY0RS0Fsw7yQPMScIXdtxvNAWtBfNO8uBmwn1GU9BaMO8kDyZzkvAN4TaDg6agtWDeSR5M5iThBnu+N5qC1oJ5Z+XBZE4SbiR8bTQFrYWVeSd5gDlJuMOOz42moLVg3knmneTBw4TrRlPQWjDvaC2Yd5IHkzlJuJNwaTQFrYWVeWflAeYk4QF73htNQWvBvPORB0/bsRlNQWthpbWw8mAyJwkPEo5GU9BaSOadtzyYzEnCE3bAaApaC8m8o7Ww8mAyJwlP2nOFeSd5MJmTBFi4X/DGnjfMOysPJnPSL6BytHC74CiAAGLPiXkneXBmTvoDKLCwWbgUXBdAAB3owtHQypk5q7/AwtHC14JLAQQQQAe6sBlsfgMLRwvfCzbBJoAAAggghPcWYGGzcGkBgkvBe8EmOPkHCbXGYP9vMrQAAAAASUVORK5CYII=","k":["start","buy"],"src":"อาวุธที่เลือกตอนสร้างตัวละคร","note":"ATK 19 สูงกว่า Sword และ Hand Axe ใช้แค่เลเวล 1–4"},"Razor":{"shop":null,"nshop":0,"id":558,"sub":"Dagger","lv":5,"st":{"watk":23,"attackSpeed":4,"slots":7},"spd":"Fast","ic":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAaCAYAAACkVDyJAAABp0lEQVR4Aa3BC3XjMBRF0XOzQkCF4IEgQ4ggdCiEQiCYgotFEEzBhWBBeGNJnuV82/z2Fu9lnBJnxPuY2UDVEiOEQCaObHg     <p><b>ตอนปาดาว</b> ดาเมจของ Lucky Seven คิดจาก LUK เป็นหลัก คูณกับ ATK รวมของ claw และดาว DEX แทบไม่เพิ่มดาเมจของท่านี้ จึงลง DEX แค่พอใส่ claw</p>
    <p><b>ตอนใช้มีด</b> ดาเมจสุ่มอยู่ระหว่างขอบล่างกับขอบบน (สูตรของ MeowDB)</p>
    <ul class="olist">
      <li>ขอบบน = (1 + (2 × LUK + STR + DEX) / 100) × ATK มีด × % สกิล</li>
      <li>ขอบล่าง = (0.8 + (2 × LUK × Mastery + STR + DEX) / 100) × ATK มีด × % สกิล</li>
    </ul>
    <p>LUK ดันขอบบน ส่วน DEX บวกทั้งสองขอบเท่ากัน จึงช่วยดาเมจเฉลี่ยด้วย หลัง Dagger Mastery เต็ม LUK คุ้มกว่า DEX ราว 1.5–1.8 เท่า และ DEX ยังเพิ่มความแม่น แผนนี้จะมี DEX 45 ตอนเลเวล 44 ซึ่งพอใส่มีดและชุดโจรถึงเลเวล 50 จึงลง LUK ล้วนหลังจากนั้น</p>

function bJobOk(it){ const j = it.st.reqJob; return !j || j.split("/").includes(BUILD.job || "Thief"); }

function bStatText(it, keys){

  if (t.wdef) out.push(`WDEF ${t.wdef}`);

function bReqText(it, L){
  const t = it.st, s = bStats(L), out = [];

/* ช่วงเลเวลที่ของชิ้นนี้เป็นของหลักในบิลด์ */
function bUseRange(n){

function bTipHTML(n, L, ctx){

/* ---- tooltip ---- */
let bTipEl = null, bTipFor = null;
function bTipShow(el){
  if (!bTipEl) { bTipEl = document.createElement("div"); bTipEl.className = "gtip"; bTipEl.setAttribute("role", "tooltip"); bTipEl.id = "gtip"; document.body.appendChild(bTipEl); }
  const n = el.dataset.gi, L = +el.dataset.glv || (bIt(n) ? Math.max(bIt(n).lv, 1) : 1);
  let ctx = null;
  if (el.dataset.gslot != null) { const b = BUILD.br[bState.br], s = b.s[el.dataset.gslot]; ctx = s ? {note: s.note, alt: s.alt, isNew: el.classList.contains("new")} : null; }
  bTipEl.innerHTML = bTipHTML(n, L, ctx);
  bTipEl.hidden = false; bTipFor = el; el.setAttribute("aria-describedby", "gtip");
  const r = el.getBoundingClientRect(), w = bTipEl.offsetWidth, h = bTipEl.offsetHeight, vw = innerWidth, vh = innerHeight;
  let x = r.right + 10, y = r.top;
  if (x + w > vw - 8) x = r.left - w - 10;
  if (x < 8) { x = Math.max(8, Math.min(vw - w - 8, r.left + r.width / 2 - w / 2)); y = r.bottom + 8; if (y + h > vh - 8) y = r.top - h - 8; }
  y = Math.max(8, Math.min(y, vh - h - 8));
  bTipEl.style.left = x + "px"; bTipEl.style.top = y + "px";
}
function bTipHide(){ if (bTipEl) bTipEl.hidden = true; if (bTipFor) bTipFor.removeAttribute("aria-describedby"); bTipFor = null; }
document.addEventListener("pointerover", e => { if (e.pointerType === "touch") return; const t = e.target.closest("[data-gi]"); if (t && t !== bTipFor) bTipShow(t); });
document.addEventListener("pointerout", e => { if (e.pointerType === "touch") return; const t = e.target.closest("[data-gi]"); if (t && !t.contains(e.relatedTarget)) bTipHide(); });
document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest("[data-gi]"); if (t) bTipShow(t); });
document.addEventListener("focusout", e => { const t = e.target.closest && e.target.closest("[data-gi]"); if (t) bTipHide(); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-gi]");
  if (t) { if (bTipFor === t && e.pointerType !== "mouse") bTipHide(); else bTipShow(t); return; }
  if (bTipFor && !e.target.closest(".gtip")) bTipHide();
  const bb = e.target.closest("[data-bbr]"); if (bb) { bState.br = +bb.dataset.bbr; renderGear(); return; }
  const tb = e.target.closest("[data-btb]"); if (tb) { bState.tb = tb.dataset.btb; renderBTable(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") bTipHide(); });
addEventListener("scroll", () => { if (bTipFor) bTipHide(); }, {passive: true});

    if (it.k.includes("none")) st = `<span class="bst gray">ยังหาไม่ได้</span>`;
    else if (!bJobOk(it) || it.st.reqStr || it.st.reqFame || !bReqOk(it, L) && ur.lo == null) st = `<span class="bst red">ใส่ไม่ได้</span>`;
    else if (ur.lo != null) st = `<span class="bst green">ใช้ Lv.${ur.lo}–${ur.hi}</span>`;
    else if (ur.alt) st = `<span class="bst amber">ทางเลือก</span>`;
    else st = `<span class="bst gray">ไม่จำเป็น</span>`;
    return `<tr><td><button type="button" class="bname" data-gi="${attr(n)}" data-glv="${L}"><img src="${it.ic}" alt="">${esc(n)}</button></td>

  }).join("");

  bTipHide();
}
/* ---- SP timeline ---- */
function spTimeline(){
  const A = 10, Z = 50, N = Z - A + 1, pct = v => (v / N * 100).toFixed(3) + "%";
  const ticks = [10, 20, 30, 40, 50].map(v => `<span class="tk" style="left:${pct(v - A + .5)}">${v}</span>`).join("");
  const rows = BUILD.sp.map(r => `<div class="spr"><div class="spn"><b>${esc(r.n)}</b><small>${esc(r.d)}</small></div>
    <div class="spt">${BUILD.jobLines.map(j => `<span class="spj" style="left:${pct(j.lv - A)}"></span>`).join("")}${r.seg.map(([f, t, p]) => `<span class="spb" style="left:${pct(f - A)};width:${pct(t - f + 1)}" title="Lv.${f}${t !== f ? "–" + t : ""}: ลงถึง ${p}"><em>${p}</em></span>`).join("")}</div></div>`).join("");
  return `<div class="spwrap"><div class="spgrid">
    <div class="spr sph"><div class="spn"></div><div class="spt axis">${ticks}${BUILD.jobLines.map(j => `<span class="spjl" style="left:${pct(j.lv - A)}">${j.t}</span>`).join("")}</div></div>
    ${rows}</div></div>`;
}

const gPace = () => { const v = +state.gpace; return v >= 2 && v <= 60 ? v : 10; };
const gNum = v => Math.round(v).toLocaleString("en-US");
function gExp(from, to){ let s = 0; for (let l = from; l < to; l++) s += GRIND.exp[l] || 0; return s; }
function gAvgExp(st){
  const m = st.maps[0]; let w = 0, e = 0;
  m.mob.forEach(([n, c]) => { const x = GRIND.mobs[n]; if (x) { w += c; e += c * x.exp; } });
  return w ? e / w : 0;
}
function gHours(kills){ const h = kills / gPace() / 60; return h < 1 ? `${Math.max(1, Math.round(h * 60))} นาที` : `${h < 10 ? h.toFixed(1) : Math.round(h)} ชั่วโมง`; }
function gMobRow(n){
  const x = GRIND.mobs[n], m = MOB[n] || {};

  return `<tr><td><a class="gmob" href="${x.u}" target="_blank" rel="noopener">${img ? `<img src="${img}" alt="">` : ""}<b>${esc(n)}</b></a></td>

}
function gMapTile(mp){

  const url = `https://meowdb.com/msclassic/maps/${mp.id}`;
  return `<div class="gmap">

function gDrops(st){

/* แยกบรรทัดหลักที่มีรายการคั่นด้วย " · " ให้เป็นหัวข้อ + bullet */
function splitX(x){
  const s = String(x), segs = []; let depth = 0, tag = false, last = 0;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (c === "<") tag = true; else if (c === ">") tag = false;
    else if (!tag && c === "(") depth++; else if (!tag && c === ")") depth = Math.max(0, depth-1);
    else if (!tag && depth === 0 && c === "·"){ segs.push(s.slice(last, i).trim()); last = i+1; }
  }
  if (!segs.length) return {head: s, items: []};
  segs.push(s.slice(last).trim());
  const pre = segs[0], rest = segs.slice(1);
  const topIdx = (str, needle, fromEnd) => { let d = 0, t = false, found = -1;
    for (let i = 0; i < str.length; i++){ const c = str[i];
      if (c === "<") t = true; else if (c === ">") t = false;
      else if (!t && c === "(") d++; else if (!t && c === ")") d = Math.max(0, d-1);
      if (!t && d === 0 && str.startsWith(needle, i)){ found = i; if (!fromEnd) break; } }
    return found; };
  const colonLike = seg => { const p = seg.replace(/<[^>]+>/g, ""); const c = p.indexOf(": "); return c > 0 && c < 22; };
  let cut = -1, len = 0;
  const d = topIdx(pre, " — ", true);
  if (d > 0){ cut = d; len = 3; }
  else if (!rest.some(colonLike)){ const c = topIdx(pre, ": ", false); if (c > 0 && pre.slice(0, c).replace(/<[^>]+>/g, "").trim().length >= 9){ cut = c; len = 2; } }
  if (cut > 0) return {head: pre.slice(0, cut + (len === 2 ? 1 : 0)).trim(), items: [pre.slice(cut + len).trim(), ...rest]};
  return {head: pre, items: rest};
}

function actHTML(a, i, j){
  const k = i+"-"+j, done = !!state.done[k];
  const L = splitX(a.x), subs = [...L.items, ...(a.sub||[])];

  if (a.from) facts += `<dt>ดรอปจาก</dt><dd>${ico(a.from)}</dd>`;
  if (a.map) facts += `<dt>แมพ</dt><dd>${a.map}</dd>`;
  return `<li class="act ${done?"done":""}">
    <input type="checkbox" id="c${k}" data-k="${k}" ${done?"checked":""} aria-label="ทำเสร็จแล้ว">
    <div>

      ${facts?`<dl class="facts">${facts}</dl>`:""}

  </li>`;
}

function go(n){
  if (n < 0 || n >= S.length) return;
  state.i = n; state.sq = null; save(); render(); closeAll();
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

function buildTicks(){
  const t = $("track");
  [1,10,20,30,40,50].forEach(v => {
    const el = document.createElement("span");
    el.className = "track-tick"; el.style.left = ((v-1)/49*100) + "%"; el.textContent = "Lv." + v;
    t.appendChild(el);
  });
}
function buildKeep(){
  $("keepTable").innerHTML = `<thead><tr><th>ของ</th><th>จำนวน</th><th>ดรอปจาก</th><th>แมพ</th><th>เก็บช่วง</th><th>ใช้กับ</th></tr></thead><tbody>${KEEP.map(r=>`<tr>${r.map((c,ci)=>`<td>${ci===0||ci===2?ico(esc(c)):esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
}

function openDrawer(){ $("drawer").classList.add("open"); $("overlay").classList.add("open"); }
function openKeep(){ $("keepModal").classList.add("open"); $("overlay").classList.add("open"); $("closeKeep").focus(); }
function closeAll(){ $("drawer").classList.remove("open"); $("keepModal").classList.remove("open"); $("overlay").classList.remove("open"); }

document.addEventListener("click", e => {
  const mmb = e.target.closest(".mm"); if (mmb){ mmb.classList.toggle("big"); return; }
  const nmb = e.target.closest(".npcmap"); if (nmb){ openNpcMap(nmb.dataset.npc); return; }
  const tb = e.target.closest("button[data-tab]"); if (tb) return setTab(tb.dataset.tab);
  const sqb = e.target.closest("[data-sq]"); if (sqb){ setTab("route"); return openSq(sqb.dataset.sq); }
  const sc = e.target.closest("[data-go]"); if (sc){ setTab("route"); return go(+sc.dataset.go); }
  const mt = e.target.closest(".tile.map"); if (mt) return openMap(mt.dataset.map);
  if (e.target.closest("#lightbox") && !e.target.closest("a")) return $("lightbox").classList.remove("open");
  const tab = e.target.closest(".tab"); if (tab) go(+tab.dataset.i);
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (e.target.checked) state.done[k] = true; else delete state.done[k];
  save(); render();
});
$("prev").onclick = () => state.sq ? go(state.i) : go(state.i-1);
$("next").onclick = () => go(state.i+1);
$("openDrawer").onclick = openDrawer;
$("openKeep").onclick = openKeep;
$("closeKeep").onclick = closeAll;
$("overlay").onclick = closeAll;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("lightbox").classList.remove("open"); return closeAll(); }
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") go(state.i+1);
  if (e.key === "ArrowLeft") state.sq ? go(state.i) : go(state.i-1);
});

const FARM_RARE_GOOD = 10000, FARM_EQ_MANY = 5;
let farmSort = "value";
const fmt = v => Number(v).toLocaleString("en-US");
function farmRows(){
  return Object.keys(FARM).filter(n => MOB[n]).map(n => {
    const ds = FARM[n].map(([name, k, npc, score]) => {
      const m = (MKT.prices || {})[name] || {};
      return {name, k, npc, score, fm: m.usual || null, rep: (m.priceChecks || 0) + (m.soldChecks || 0)};
    });
    const sig = ds.filter(d => d.k === "sig" && d.npc);
    const ore = ds.filter(d => d.k === "etc" && d.npc);
    const equip = ds.filter(d => d.k === "eq");
    const valued = ds.filter(d => (d.k === "eq" || d.k === "scroll") && d.fm && d.fm >= (d.npc || 0) * MKT_RATIO).sort((a, b) => b.fm - a.fm);
    const top = valued.find(d => d.rep >= MKT_MIN_REPORTS);
    const st = mobStatus(n);
    const tags = [];
    if (top && top.fm >= FARM_RARE_GOOD) tags.push(["rare", "มีของราคาสูง"]);
    if (equip.length >= FARM_EQ_MANY) tags.push(["eq", "ดรอปอุปกรณ์หลายชนิด"]);
    return {n, lv: parseInt(MOB[n].lv, 10) || 0, hp: parseInt(String(MOB[n].hp).replace(/,/g, ""), 10) || 0, exp: parseInt(String(MOB[n].exp).replace(/,/g, ""), 10) || 0, sig, ore, equip, valued, top: valued[0] ? valued[0].fm : 0, st, tags};
  });
}
function farmRow(r){
  const range = a => { const p = a.map(d => d.npc).filter(Boolean); return p.length ? (Math.min(...p) === Math.max(...p) ? `${fmt(p[0])} meso` : `${fmt(Math.min(...p))} meso ถึง ${fmt(Math.max(...p))} meso`) : ""; };
  let etc = r.sig.length ? r.sig.map(d => `${itemIco(d.name)} ${fmt(d.npc)} meso`).join("<br>") : `<span class="mt">ไม่มี ETC ประจำตัว</span>`;
  if (r.ore.length) { const ofm = Math.max(0, ...r.ore.map(d => d.fm || 0)); etc += `<div class="mkfrom">แร่และอัญมณี ${r.ore.length} ชนิด ขาย NPC ชิ้นละ ${range(r.ore)}${ofm ? `<br>ขายผู้เล่นได้ถึงประมาณ ${fmt(ofm)} meso` : ""}</div>`; }
  const val = r.valued.length ? r.valued.slice(0, 3).map(d => `${itemIco(d.name)} ประมาณ ${fmt(d.fm)} meso${d.rep < MKT_MIN_REPORTS ? ` <span class="mt">(ข้อมูลน้อย)</span>` : ""}`).join("<br>") : `<span class="mt">ยังไม่มีอุปกรณ์หรือม้วนที่ขายผู้เล่นได้แพงกว่า NPC</span>`;
  const eq = r.equip.length ? `ดรอปอุปกรณ์ ${r.equip.length} ชนิด${range(r.equip) ? `<br>ขายให้ NPC ได้ชิ้นละ ${range(r.equip)}` : ""}` : `<span class="mt">ยังไม่มีคนยืนยันว่าดรอปอุปกรณ์</span>`;
  const where = r.st.k === "must" ? `<span class="rs must inl">route นี้ต้องตีอยู่แล้ว</span> ${stepBtns(r.st.st)}` : r.st.k === "near" ? `<span class="rs near inl">อยู่ใกล้ route แวะตีได้</span> ${stepBtns(r.st.st)}` : `<span class="rs no inl">route นี้ไม่ผ่าน</span>`;
  return `<div class="prow fm"><div class="pc pc0">${ico(r.n)}<div class="mkfrom">เลเวล ${r.lv}, HP ${fmt(r.hp)}, ได้ ${fmt(r.exp)} EXP ต่อตัว</div>${r.tags.length ? `<div class="fmtags">${r.tags.map(([k, t]) => `<span class="fmtag ${k}">${t}</span>`).join("")}</div>` : ""}<div class="fmwhere">${where}</div></div><div class="pc"><span class="mkl">ETC ประจำตัว ขาย NPC: </span>${etc}</div><div class="pc"><span class="mkl">อุปกรณ์และม้วนที่ขายผู้เล่นได้แพง: </span>${val}</div><div class="pc mkinfo">${eq}</div></div>`;
}

/* แทนตัวคั่น " · " ด้วยการขึ้นบรรทัดใหม่ในทุกข้อความที่แสดงบนหน้า */
(function(){
  const SKIP = new Set(["SCRIPT","STYLE","TEXTAREA","OPTION","TITLE","svg"]);
  const RE = /\s*·\s*/;
  function fix(root){
    if (!root) return;
    if (root.nodeType === 3) { split(root); return; }
    if (root.nodeType !== 1 || SKIP.has(root.nodeName)) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => {
      for (let p = n.parentNode; p && p !== root.parentNode; p = p.parentNode) if (SKIP.has(p.nodeName) || (p.classList && p.classList.contains("rs"))) return NodeFilter.FILTER_REJECT;
      return RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; } });
    const list = []; while (w.nextNode()) list.push(w.currentNode);
    list.forEach(split);
  }
  function split(n){
    if (!RE.test(n.nodeValue) || !n.parentNode || (n.parentNode.closest && n.parentNode.closest(".rs"))) return;
    const parts = n.nodeValue.replace(/\(([^()]*)\)/g, m => m.replace(/\s*·\s*/g, ", ")).split(/\s*·\s*/);
    const frag = document.createDocumentFragment();
    parts.forEach((t, i) => {
      if (i > 0 && !(i === 1 && parts[0].trim() === "" && !n.previousSibling) && !(i === parts.length - 1 && t.trim() === "" && !n.nextSibling)) frag.appendChild(document.createElement("br"));
      if (t !== "") frag.appendChild(document.createTextNode(t));
    });
    n.parentNode.replaceChild(frag, n);
  }
  fix(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(fix))).observe(document.body, {childList:true, subtree:true});
})();


/* แปลง "669 EXP" / "1,200 meso" ให้เป็นป้ายมีไอคอน */
(function(){
  const SKIP = new Set(["SCRIPT","STYLE","TEXTAREA","OPTION","TITLE","BUTTON","svg"]);
  const RE = /([+~≈]?\s?\d[\d,]*(?:\.\d+)?(?:\s*[–-]\s*\d[\d,]*)?)\s*(EXP|mesos?)(?![A-Za-z])/gi;
  const T = /\d[\d,]*(?:\.\d+)?\s*(?:[–-]\s*\d[\d,]*\s*)?(?:EXP|mesos?)(?![A-Za-z])/i;
  function ok(n){
    for (let p = n.parentNode; p; p = p.parentNode){
      if (p.nodeType !== 1) break;
      if (SKIP.has(p.nodeName) || (p.classList && (p.classList.contains("cx") || p.classList.contains("rs")))) return false;
    }
    return true;
  }
  function chip(num, unit){
    const s = document.createElement("span");
    const isExp = /exp/i.test(unit);
    s.className = "cx " + (isExp ? "exp" : "meso");
    s.innerHTML = `<span class="ci" aria-hidden="true"></span><b></b><small></small>`;
    s.querySelector("b").textContent = num.replace(/\s+/g, "");
    s.querySelector("small").textContent = isExp ? "EXP" : "meso";
    s.title = isExp ? "ค่าประสบการณ์ (EXP)" : "เงิน (meso)";
    return s;
  }
  function split(n){
    const v = n.nodeValue; if (!T.test(v) || !n.parentNode || !ok(n)) return;
    const frag = document.createDocumentFragment(); let last = 0; RE.lastIndex = 0; let m;
    while ((m = RE.exec(v))){
      if (m.index > last) frag.appendChild(document.createTextNode(v.slice(last, m.index)));
      frag.appendChild(chip(m[1], m[2])); last = RE.lastIndex;
    }
    if (last < v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  function fix(root){
    if (!root) return;
    if (root.nodeType === 3) { split(root); return; }
    if (root.nodeType !== 1 || SKIP.has(root.nodeName) || (root.classList && root.classList.contains("cx"))) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => T.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
    const list = []; while (w.nextNode()) list.push(w.currentNode);
    list.forEach(split);
  }
  fix(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(fix))).observe(document.body, {childList:true, subtree:true});
})();
