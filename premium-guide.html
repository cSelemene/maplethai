<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Guide — MapleThai</title><style>body{font-family:system-ui,sans-serif;background:#eaf3fc;color:#1d3659;margin:0}header{background:#23426a;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}a{color:inherit}main{max-width:880px;padding:24px;margin:auto}.panel{background:#fff;border:1px solid #c9dbee;border-radius:15px;padding:25px}button,.btn{padding:12px 16px;background:#e47727;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}#viewer{height:80vh;min-height:480px;width:100%;background:white;border:1px solid #becdde;border-radius:10px;margin-top:16px}#viewer[hidden]{display:none}.muted{color:#667991}#status{line-height:1.8}</style></head><body><header><strong>🍁 MapleThai — Premium</strong><nav><a href="./home.html">หน้าแรก</a> · <a href="./auth.html">บัญชีผู้ใช้</a></nav></header><main><div class="panel"><h1 id="heading">กำลังตรวจสอบสิทธิ์</h1><p id="status" role="status" aria-live="polite">กรุณารอสักครู่…</p><div id="actions" hidden><a id="login" class="btn" href="./auth.html">เข้าสู่ระบบ / สมัครสมาชิก</a> <a id="preview" class="btn" href="./guide-preview.html">อ่านตัวอย่างฟรี</a></div><iframe id="viewer" title="ไกด์ฉบับเต็ม" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups" hidden></iframe></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './auth-config.js';
const PRODUCTS={bandit:'Pure Bandit',assassin:'Assassin',mage:'Ice / Lightning Mage'};
const id=new URLSearchParams(location.search).get('guide');
const $=x=>document.getElementById(x);let objectURL=null;
if(!Object.hasOwn(PRODUCTS,id)){$('heading').textContent='ไม่พบไกด์';$('status').textContent='กรุณากลับไปเลือกอาชีพที่หน้าแรก';$('actions').hidden=false;}
else{
 $('heading').textContent=PRODUCTS[id]+' — ไกด์ฉบับเต็ม';$('preview').href='./guide-preview.html?guide='+encodeURIComponent(id);
 const s=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 try{
   const {data:{user},error:authError}=await s.auth.getUser();
   if(authError||!user){$('status').textContent='กรุณาเข้าสู่ระบบก่อนอ่านไกด์ Premium';$('actions').hidden=false;}
   else{
     $('status').textContent='กำลังตรวจสอบสิทธิ์ของบัญชีและโหลดไกด์…';
     const {data,error}=await s.rpc('get_guide',{p_guide:id});
     if(error){$('status').textContent='บัญชีนี้ยังไม่มีสิทธิ์อ่านไกด์ '+PRODUCTS[id]+' หรือไม่สามารถโหลดไกด์ได้ในขณะนี้ กรุณาตรวจสอบสิทธิ์กับผู้ดูแล';$('actions').hidden=false;}
     else if(typeof data!=='string'||!data.trim()){$('status').textContent='ไม่พบข้อมูลไกด์ กรุณาติดต่อผู้ดูแล';$('actions').hidden=false;}
     else{
       // Data comes from the entitlement-checked Supabase RPC. Never cache or embed it in public static files.
       // A Blob URL resolves embedded image data without exposing a static guide endpoint.
       const doc=data.replace(/<head([^>]*)>/i,'<head$1><base href="'+new URL('./',location.href).href+'">');
       objectURL=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));
       $('viewer').src=objectURL;$('viewer').hidden=false;
       $('status').textContent='เข้าสู่ระบบสำเร็จ • ตรวจสอบสิทธิ์ผ่านแล้ว';
     }
   }
 }catch(_){$('status').textContent='เกิดปัญหาในการเชื่อมต่อ กรุณาลองอีกครั้ง';$('actions').hidden=false;}
}
window.addEventListener('pagehide',()=>{if(objectURL)URL.revokeObjectURL(objectURL)});
</script></body></html>
