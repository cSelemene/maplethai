<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>เข้าสู่ระบบ | MapleThai</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#223451;background:#e7f1fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(100%,440px);background:white;border-radius:15px;padding:28px;box-shadow:0 10px 25px #22406f18}h1{margin:0;color:#22406f}.muted{color:#65738b}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1;background:#edf2fa;color:#22406f}.tabs button[aria-selected=true]{background:#22406f;color:white}button{border:0;border-radius:8px;padding:11px 14px;cursor:pointer;background:#d66d1c;color:white;font:inherit;font-weight:600}button:disabled{opacity:.5}label{display:block;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #b4c7dd;border-radius:8px;font:inherit}form button{width:100%;margin-top:18px}.message{padding:11px;background:#edf4fb;border-radius:9px;margin:15px 0;white-space:pre-wrap}.message.error{color:#932424;background:#fff0f0}.message.success{color:#1f663b;background:#ecf9f0}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0}.hidden{display:none}a{color:#245c9c}
</style></head><body><main class="panel"><h1>🍁 MapleThai</h1><p class="muted">บัญชีสำหรับชุมชน MapleStory Classic</p><div id="guest"><div class="tabs"><button id="login-tab" aria-selected="true" type="button">เข้าสู่ระบบ</button><button id="signup-tab" aria-selected="false" type="button">สมัครสมาชิก</button></div><form id="auth-form"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">เข้าสู่ระบบ</button></form><div class="links"><a href="./index.html">← กลับไปไกด์</a><button type="button" id="forgot">ลืมรหัสผ่าน?</button></div></div><section id="account" class="hidden"><p>เข้าสู่ระบบเป็น <strong id="account-email"></strong></p><p class="muted">หน้านี้ทดสอบ Login เท่านั้น ยังไม่เปิดระบบจ่ายเงินหรือขายสิทธิ์</p><button id="logout">ออกจากระบบ</button><p><a href="./index.html">กลับไปหน้าไกด์</a></p></section><section id="recovery" class="hidden"><h2>ตั้งรหัสผ่านใหม่</h2><form id="recovery-form"><label for="new-password">รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">เปลี่ยนรหัสผ่าน</button></form></section><p id="message" class="message" role="status" aria-live="polite"></p></main><script type="module" src="./auth.js"></script></body></html>
